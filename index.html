  <style>
    body {

      background-color: #020617;
      /* Slate 950 */
      color: #e2e8f0;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    .gradient-text {
      background: linear-gradient(135deg, #6366f1, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glow-hover:hover {
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .tab-active {
      border-bottom: 2px solid #6366f1;
      color: #6366f1;
    }

    .tab-inactive {
      border-bottom: 2px solid transparent;
      color: #64748b;
    }

    .tab-inactive:hover {
      color: #94a3b8;
    }

    .link-line {
      stroke-dasharray: 5, 5;
      animation: dash 20s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }

    .node-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }
  </style>

    const FILTER_FLAGS = [
      { flag: "SERACH_BAR", use: "Search Bar In Frame", canUseIn: "CANVAS, TABLE, ENTRY_TABLE" },
      { flag: "TABLE_SCROLL", use: "Scroll Feature in Table", canUseIn: "CANVAS, TABLE, ENTRY_TABLE, CARD, PROFILE_CARD" },

      { flag: "NO_DOWNLOAD", use: "To Hide Download Button In (table & entry table)", canUseIn: "TABLE / ENTRY_TABLE" },
    ];

    const INPUT_PATTERNS = [
      { no: 1, keyword: "EMAIL", use: "Write proper email IDs. Multiple emails separated by comma" },
      { no: 2, keyword: "PASSWORD", use: "To hide the text written" },
      { no: 3, keyword: "CAPS", use: "To do all the letters in capital" },
      { no: 4, keyword: "MOBILE", use: "Validate only to use numbers only without country code" },

      { no: 7, keyword: "SENTENCE", use: "Validate to write proper sentence with full stop at end" },
      { no: 8, keyword: "LOWER", use: "To do all the letters in small letters" },
      { no: 9, keyword: "ALPHANUMERIC", use: "Allow alphanumeric characters only" },
      { no: 10, keyword: "INITCAPS", use: "To do all the first letters in capital" },
      { no: 11, keyword: "LOV_POPLIST", use: "Configure the values with LOV_CODE" },
      { no: 12, keyword: "SQL_POPLIST", use: "Configure the values with SQL_TEXT" },
      { no: 13, keyword: "A#APPLE,B#BALL", use: "Static configuration pattern (key#value pairs)" },

    const LIBRARIES = [
      { no: 1, name: "AJS_CHECK_NULL_VALUE", use: "Check if item is null and send alert message", syntax: "ajs_check_null_item(a_item_name, a_alert)" },
      { no: 2, name: "AJS_SET_BODY_SLNO", use: "Generate new slno", syntax: "ajs_set_body_slno(a_tempBody, a_slno)" },

    ];

    // ─── HELPERS ─────────────────────────────────────────────────────────────────
    const typeColor = (t) => {
      if (t.startsWith("VARCHAR")) return "#38bdf8";
      if (t.startsWith("NUMBER")) return "#a78bfa";
      if (t === "DATE") return "#34d399";
      return "#fb923c";
    };

    const categoryColor = (c) => {
      const map = { Frame: "#6366f1", Item: "#10b981", Object: "#f59e0b", Page: "#ec4899", Record: "#14b8a6", Backend: "#ef4444", Frontend: "#8b5cf6", WebService: "#0ea5e9", Utility: "#84cc16" };
      return map[c] || "#94a3b8";
    };

    const PALETTE = ["#6366f1", "#8b5cf6", "#10b981", "#f59e0b", "#ec4899", "#14b8a6", "#ef4444", "#0ea5e9", "#84cc16", "#f97316"];

    // ─── ANALYZE COMMON FIELDS ───────────────────────────────────────────────────
    const analyzeCommonFields = () => {
      const fieldMap = {};

      // Build field occurrence map
      DB_TABLES.forEach(table => {
        table.columns.forEach(col => {
          if (!fieldMap[col.name]) {
            fieldMap[col.name] = {
              name: col.name,
              type: col.type,
              nullable: col.nullable,
              tables: [],
              count: 0,
              isPK: false,
              isFK: false
            };
          }
          fieldMap[col.name].tables.push({
            table: table.name,
            pk: col.pk || false,
            fk: col.fk || null,
            nullable: col.nullable,
            default: col.default
          });
          fieldMap[col.name].count++;
          if (col.pk) fieldMap[col.name].isPK = true;
          if (col.fk) fieldMap[col.name].isFK = true;
        });
      });

      // Filter fields that appear in multiple tables (common fields)
      const commonFields = Object.values(fieldMap)
        .filter(f => f.count > 1)
        .sort((a, b) => b.count - a.count);

      return commonFields;
    };

    const COMMON_FIELDS = analyzeCommonFields();

    // ─── UI COMPONENTS ───────────────────────────────────────────────────────────

    const Badge = ({ children, color = "#6366f1", small }) => (
      <span className={`inline-block border rounded font-mono whitespace-nowrap ${small ? 'text-[10px] px-1.5 py-0.5' : 'text-[11px] px-2 py-0.5'}`}
        style={{ backgroundColor: `${color}22`, color: color, borderColor: `${color}55` }}>
        {children}
      </span>
    );

    const Pill = ({ children, color = "#64748b" }) => (
      <span className="inline-block rounded-full px-2.5 py-0.5 text-[11px] font-medium whitespace-nowrap"
        style={{ backgroundColor: `${color}18`, color: color, border: `1px solid ${color}40` }}>
        {children}
      </span>
    );

    const SectionHeader = ({ icon, title, subtitle, count }) => (
      <div className="mb-6">
        <div className="flex items-center gap-3 mb-2">
          <span className="text-2xl">{icon}</span>
          <div>
            <h2 className="text-xl font-bold text-slate-100 font-mono tracking-tight">{title}</h2>
            {subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}
          </div>
          {count !== undefined && (
            <div className="ml-auto bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-xs font-semibold text-slate-400">
              {count} entries
            </div>
          )}
        </div>
        <div className="h-0.5 bg-gradient-to-r from-indigo-500 to-transparent rounded-full w-full"></div>
      </div>
    );

    // ─── TABLE CARD ───────────────────────────────────────────────────────────────

    const TableCard = ({ table, onSelect, selected }) => (
      <div onClick={() => onSelect(table)}
        className={`p-4 rounded-xl cursor-pointer transition-all duration-200 border-2 ${selected ? 'bg-slate-800 scale-[1.02]' : 'bg-slate-900 hover:bg-slate-800'}`}
        style={{ borderColor: selected ? table.color : '#1e293b', boxShadow: selected ? `0 0 20px ${table.color}33` : 'none' }}>
        <div className="flex items-center gap-2.5 mb-2">
          <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: table.color }}></div>
          <span className="font-mono font-bold text-sm text-slate-100 truncate">{table.name}</span>
          <span className="ml-auto text-[10px] text-slate-500 font-medium">{table.columns.length} cols</span>
        </div>
        <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-2">{table.description}</p>
        <div className="flex gap-1.5 flex-wrap">
          {table.primaryKey.map(k => <Badge key={k} color="#f59e0b" small>PK: {k}</Badge>)}
        </div>
      </div>
    );

    // ─── TABLE DETAIL ──────────────────────────────────────────────────────────────

    const TableDetail = ({ table }) => {
      const [search, setSearch] = useState("");
      const filtered = table.columns.filter(c =>
        c.name.toLowerCase().includes(search.toLowerCase()) ||
        c.type.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div>
          <div className="flex items-center gap-3 mb-5">
            <div className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: table.color }}></div>
            <h3 className="text-lg font-bold text-slate-100 font-mono">{table.name}</h3>
            <Pill color={table.color}>{table.columns.length} columns</Pill>
          </div>
          <p className="text-sm text-slate-400 mb-4">{table.description}</p>

          <div className="mb-4 space-y-2">
            <div className="flex flex-wrap gap-2 items-center">
              <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Primary Key:</span>
              {table.primaryKey.map(k => <Badge key={k} color="#f59e0b">{k}</Badge>)}
            </div>
            {table.columns.filter(c => c.fk).length > 0 && (
              <div className="flex flex-wrap gap-2 items-center">
                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Foreign Keys:</span>
                {table.columns.filter(c => c.fk).map(c => (
                  <Badge key={c.name} color="#ec4899">{c.name} → {c.fk}</Badge>
                ))}
              </div>
            )}
          </div>

          <div className="relative mb-3">
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Search columns..."
              className="w-full bg-slate-950 border border-slate-700 rounded-lg py-2 px-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
            />
            <svg className="w-4 h-4 text-slate-600 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>

          <div className="border border-slate-800 rounded-xl overflow-hidden bg-slate-950">
            <table className="w-full text-left text-xs font-mono">
              <thead>
                <tr className="bg-slate-900 text-slate-400 border-b border-slate-800">
                  {["Column Name", "Data Type", "Nullable", "Flags", "Default"].map(h => (
                    <th key={h} className="p-3 font-bold uppercase tracking-wider">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map((col) => (
                  <tr key={col.name} className="hover:bg-slate-900/50 transition-colors">
                    <td className={`p-3 font-medium ${col.pk ? 'text-amber-400' : col.fk ? 'text-pink-400' : 'text-slate-300'}`}>
                      {col.name}
                    </td>
                    <td className="p-3"><Badge color={typeColor(col.type)} small>{col.type}</Badge></td>
                    <td className={`p-3 font-semibold ${col.nullable ? 'text-slate-500' : 'text-red-400'}`}>
                      {col.nullable ? "YES" : "NOT NULL"}
                    </td>
                    <td className="p-3 flex gap-1.5 flex-wrap">
                      {col.pk && <Badge color="#f59e0b" small>PK</Badge>}
                      {col.fk && <Badge color="#ec4899" small>FK</Badge>}
                    </td>
                    <td className="p-3 text-slate-500">{col.default || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ─── COMMON FIELDS VISUALIZER ─────────────────────────────────────────────────

    const CommonFieldsView = () => {
      const [selectedField, setSelectedField] = useState(null);
      const [search, setSearch] = useState("");
      const [minOccurrence, setMinOccurrence] = useState(2);

      const filteredFields = COMMON_FIELDS.filter(f =>
        f.count >= minOccurrence &&
        (f.name.toLowerCase().includes(search.toLowerCase()) ||
          f.type.toLowerCase().includes(search.toLowerCase()))
      );

      const getFieldColor = (count) => {
        if (count >= 8) return "#ef4444"; // Red - highly common
        if (count >= 5) return "#f59e0b"; // Orange - very common
        if (count >= 3) return "#10b981"; // Green - common
        return "#6366f1"; // Indigo - less common
      };

      return (
        <div className="animate-fade-in">
          <SectionHeader
            icon="🔗"
            title="Common Fields Analysis"
            subtitle="Fields that appear across multiple tables — showing database-wide linking columns"
            count={COMMON_FIELDS.length}
          />

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left Panel - Field List */}
            <div className="lg:col-span-1 space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div className="space-y-3">
                  <div className="relative">
                    <input
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="Search common fields..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg py-2 px-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                    <svg className="w-4 h-4 text-slate-600 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-500">Min tables:</span>
                    <input
                      type="range"
                      min="2"
                      max="10"
                      value={minOccurrence}
                      onChange={e => setMinOccurrence(parseInt(e.target.value))}
                      className="flex-1 accent-indigo-500"
                    />
                    <span className="text-xs font-mono text-indigo-400 w-6">{minOccurrence}</span>
                  </div>
                </div>
              </div>

              <div className="space-y-2 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                {filteredFields.map((field, idx) => (
                  <div
                    key={field.name}
                    onClick={() => setSelectedField(field)}
                    className={`p-3 rounded-lg cursor-pointer transition-all border ${selectedField?.name === field.name ? 'bg-slate-800 border-indigo-500' : 'bg-slate-900 border-slate-800 hover:border-slate-700'}`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="font-mono font-bold text-sm text-slate-200">{field.name}</span>
                      <Badge color={getFieldColor(field.count)} small>{field.count} tables</Badge>
                    </div>
                    <div className="flex items-center gap-2 text-xs text-slate-500">
                      <Badge color={typeColor(field.type)} small>{field.type}</Badge>
                      {field.isPK && <Badge color="#f59e0b" small>PK</Badge>}
                      {field.isFK && <Badge color="#ec4899" small>FK</Badge>}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Right Panel - Field Details & Visualization */}
            <div className="lg:col-span-2">
              {selectedField ? (
                <div className="space-y-6">
                  {/* Field Header */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div className="flex items-center gap-3 mb-4">
                      <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg">
                        {selectedField.name.charAt(0)}
                      </div>
                      <div>
                        <h3 className="text-2xl font-bold text-slate-100 font-mono">{selectedField.name}</h3>
                        <div className="flex items-center gap-2 mt-1">
                          <Badge color={typeColor(selectedField.type)}>{selectedField.type}</Badge>
                          <Badge color={getFieldColor(selectedField.count)}>{selectedField.count} tables</Badge>
                          {selectedField.isPK && <Badge color="#f59e0b">Primary Key</Badge>}
                          {selectedField.isFK && <Badge color="#ec4899">Foreign Key</Badge>}
                        </div>
                      </div>
                    </div>

                    <p className="text-sm text-slate-400 leading-relaxed">
                      This field appears in <span className="text-indigo-400 font-bold">{selectedField.count}</span> tables,
                      acting as a {selectedField.isPK ? 'primary key' : selectedField.isFK ? 'foreign key' : 'common linking field'}
                      across the database schema.
                    </p>
                  </div>

                  {/* Table Occurrences */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <h4 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4">Appears In Tables</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {selectedField.tables.map((occ, idx) => {
                        const table = DB_TABLES.find(t => t.name === occ.table);
                        return (
                          <div key={occ.table} className="bg-slate-950 border border-slate-800 rounded-lg p-4 flex items-start gap-3">
                            <div className="w-2 h-2 rounded-full mt-2 flex-shrink-0" style={{ backgroundColor: table?.color || '#6366f1' }}></div>
                            <div className="flex-1 min-w-0">
                              <div className="font-mono font-bold text-sm text-slate-200 truncate">{occ.table}</div>
                              <div className="flex flex-wrap gap-1.5 mt-2">
                                {occ.pk && <Badge color="#f59e0b" small>PK</Badge>}
                                {occ.fk && <Badge color="#ec4899" small>FK → {occ.fk}</Badge>}
                                {!occ.nullable && <Badge color="#ef4444" small>NOT NULL</Badge>}
                                {occ.default && <Badge color="#10b981" small>DEFAULT: {occ.default}</Badge>}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Visual Link Diagram */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <h4 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4">Visual Link Map</h4>
                    <div className="relative h-64 bg-slate-950 rounded-lg overflow-hidden">
                      <svg width="100%" height="100%" className="absolute inset-0">
                        {/* Center node - the field */}
                        <circle cx="50%" cy="50%" r="30" fill="#6366f1" opacity="0.2" className="node-pulse" />
                        <circle cx="50%" cy="50%" r="15" fill="#6366f1" />
                        <text x="50%" y="50%" textAnchor="middle" dy="0.3em" fill="white" fontSize="10" fontWeight="bold" fontFamily="monospace">
                          {selectedField.name.length > 8 ? selectedField.name.slice(0, 6) + '..' : selectedField.name}
                        </text>

                        {/* Orbiting table nodes */}
                        {selectedField.tables.map((occ, idx) => {
                          const angle = (idx / selectedField.tables.length) * 2 * Math.PI - Math.PI / 2;
                          const radius = 80;
                          const cx = 50 + (radius * Math.cos(angle) / 4);
                          const cy = 50 + (radius * Math.sin(angle) / 2.5);
                          const table = DB_TABLES.find(t => t.name === occ.table);

                          return (
                            <g key={occ.table}>
                              <line
                                x1="50%" y1="50%"
                                x2={`${cx}%`} y2={`${cy}%`}
                                stroke={table?.color || '#6366f1'}
                                strokeWidth="1"
                                opacity="0.4"
                                className="link-line"
                              />
                              <circle
                                cx={`${cx}%`} cy={`${cy}%`} r="8"
                                fill={table?.color || '#6366f1'}
                                opacity="0.8"
                              />
                              <text
                                x={`${cx}%`} y={`${cy}%`}
                                dy="0.3em"
                                textAnchor="middle"
                                fill="white"
                                fontSize="6"
                                fontFamily="monospace"
                              >
                                {idx + 1}
                              </text>
                            </g>
                          );
                        })}
                      </svg>

                      {/* Legend */}
                      <div className="absolute bottom-3 left-3 flex flex-wrap gap-2">
                        {selectedField.tables.slice(0, 6).map((occ, idx) => {
                          const table = DB_TABLES.find(t => t.name === occ.table);
                          return (
                            <div key={occ.table} className="flex items-center gap-1.5 bg-slate-900/80 px-2 py-1 rounded text-[10px]">
                              <div className="w-2 h-2 rounded-full" style={{ backgroundColor: table?.color }}></div>
                              <span className="text-slate-400 truncate max-w-[80px]">{occ.table}</span>
                            </div>
                          );
                        })}
                        {selectedField.tables.length > 6 && (
                          <div className="text-[10px] text-slate-500 px-2 py-1">+{selectedField.tables.length - 6} more</div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="h-full flex items-center justify-center bg-slate-900 border border-slate-800 rounded-xl p-12">
                  <div className="text-center">
                    <div className="text-4xl mb-3">🔗</div>
                    <h3 className="text-lg font-bold text-slate-300 mb-2">Select a Common Field</h3>
                    <p className="text-sm text-slate-500 max-w-sm">
                      Click on any field from the list to see detailed analysis of how it links tables across the database schema.
                    </p>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Summary Stats */}
          <div className="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div className="text-2xl font-black text-indigo-400 font-mono">{COMMON_FIELDS.length}</div>
              <div className="text-xs text-slate-500 uppercase tracking-wider mt-1">Common Fields</div>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div className="text-2xl font-black text-emerald-400 font-mono">
                {COMMON_FIELDS.filter(f => f.count >= 5).length}
              </div>
              <div className="text-xs text-slate-500 uppercase tracking-wider mt-1">Highly Shared (5+)</div>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div className="text-2xl font-black text-amber-400 font-mono">
                {COMMON_FIELDS.filter(f => f.isPK).length}
              </div>
              <div className="text-xs text-slate-500 uppercase tracking-wider mt-1">Are Primary Keys</div>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div className="text-2xl font-black text-pink-400 font-mono">
                {COMMON_FIELDS.filter(f => f.isFK).length}
              </div>
              <div className="text-xs text-slate-500 uppercase tracking-wider mt-1">Are Foreign Keys</div>
            </div>
          </div>
        </div>
      );
    };

    // ─── ER DIAGRAM// ─── ER DIAGRAM ───────────────────────────────────────────────────────────────

    const ERDiagram = () => {
      const [selectedGroup, setSelectedGroup] = useState("all");
      const [hoveredTable, setHoveredTable] = useState(null);
      const [selectedTable, setSelectedTable] = useState(null);

      // All tables
      const tableGroups = {
        core: {
          label: "🏢 Core",
          color: "#3b82f6",
          tables: [
            { id: "ENTITY_MAST", name: "ENTITY_MAST", desc: "Company Master", cols: 58 },
            { id: "USER_MAST", name: "USER_MAST", desc: "User Accounts", cols: 47 },
            { id: "DIV_MAST", name: "DIV_MAST", desc: "Branch/Division", cols: 52 },
            { id: "ACC_YEAR_MAST", name: "ACC_YEAR_MAST", desc: "Fiscal Year", cols: 15 },
          ]
        },
        accounts: {
          label: "💰 Accounts",
          color: "#10b981",
          tables: [
            { id: "ACC_MAST", name: "ACC_MAST", desc: "Ledger Accounts", cols: 47 },
            { id: "ADDRESS_MAST", name: "ADDRESS_MAST", desc: "Addresses", cols: 56 },
            { id: "CONFIG_MAST", name: "CONFIG_MAST", desc: "Voucher Config", cols: 57 },
            { id: "ACC_TRAN", name: "ACC_TRAN", desc: "Accounting Entries", cols: 95 },
          ]
        },
        purchase: {
          label: "🛒 Purchase",
          color: "#f59e0b",
          tables: [
            { id: "INDENT_HEAD", name: "INDENT_HEAD", desc: "Indent Header", cols: 25 },
            { id: "INDENT_BODY", name: "INDENT_BODY", desc: "Indent Items", cols: 56 },
            { id: "ENQUIRY_HEAD", name: "ENQUIRY_HEAD", desc: "Enquiry Header", cols: 28 },
            { id: "ENQUIRY_BODY", name: "ENQUIRY_BODY", desc: "Enquiry Items", cols: 42 },
            { id: "ORDER_HEAD", name: "ORDER_HEAD", desc: "Order Header", cols: 82 },
            { id: "ORDER_BODY", name: "ORDER_BODY", desc: "Order Items", cols: 95 },
            { id: "ORDER_AFIELD", name: "ORDER_AFIELD", desc: "Additional Fields", cols: 17 },
          ]
        },
        inventory: {
          label: "📦 Inventory",
          color: "#ef4444",
          tables: [
            { id: "ITEMTRAN_HEAD", name: "ITEMTRAN_HEAD", desc: "Stock Movement H", cols: 82 },
            { id: "ITEMTRAN_BODY", name: "ITEMTRAN_BODY", desc: "Stock Movement B", cols: 118 },
            { id: "GATETRAN_HEAD", name: "GATETRAN_HEAD", desc: "Gate Entry H", cols: 62 },
            { id: "GATETRAN_BODY", name: "GATETRAN_BODY", desc: "Gate Entry B", cols: 52 },
            { id: "WB_HEAD", name: "WB_HEAD", desc: "Weighbridge", cols: 52 },
            { id: "QCTRAN_HEAD", name: "QCTRAN_HEAD", desc: "Quality Control H", cols: 52 },
            { id: "QCTRAN_BODY", name: "QCTRAN_BODY", desc: "QC Test Results", cols: 28 },
          ]
        },
        production: {
          label: "🏭 Production",
          color: "#8b5cf6",
          tables: [
            { id: "PROD_ORDER_HEAD", name: "PROD_ORDER_HEAD", desc: "Prod Order H", cols: 35 },
            { id: "PROD_ORDER_BODY", name: "PROD_ORDER_BODY", desc: "Prod Order B", cols: 52 },
            { id: "PROD_ORDER_ROUTING", name: "PROD_ORDER_ROUTING", desc: "Routing", cols: 30 },
            { id: "PROD_ORDER_PLAN", name: "PROD_ORDER_PLAN", desc: "Planning", cols: 32 },
            { id: "PROD_ORDER_ALLOC", name: "PROD_ORDER_ALLOC", desc: "Allocation", cols: 42 },
            { id: "PROD_TRAN", name: "PROD_TRAN", desc: "Production Tran", cols: 95 },
            { id: "PROD_SETUP_HEAD", name: "PROD_SETUP_HEAD", desc: "Setup H", cols: 28 },
            { id: "PROD_SETUP_BODY", name: "PROD_SETUP_BODY", desc: "Setup B", cols: 32 },
            { id: "PROD_SETUP_EQPT", name: "PROD_SETUP_EQPT", desc: "Equipment", cols: 38 },
            { id: "PROD_SETUP_ITEM", name: "PROD_SETUP_ITEM", desc: "Setup Items", cols: 35 },
            { id: "PROD_SETUP_PLAN", name: "PROD_SETUP_PLAN", desc: "Setup Plan", cols: 22 },
            { id: "PROD_SETUP_CYCLETIME", name: "PROD_SETUP_CYCLETIME", desc: "Cycle Time", cols: 25 },
            { id: "PROD_SETUP_CALENDER", name: "PROD_SETUP_CALENDER", desc: "Calendar", cols: 22 },
            { id: "PROD_ROUTING_MAST", name: "PROD_ROUTING_MAST", desc: "Route Master", cols: 20 },
            { id: "PROD_ROUTING_ALLOC_MAST", name: "PROD_ROUTING_ALLOC_MAST", desc: "Route Alloc", cols: 28 },
            { id: "PROD_PLANT_PLAN", name: "PROD_PLANT_PLAN", desc: "Plant Plan", cols: 20 },
            { id: "PROD_ITEM_PROCESS_MAST", name: "PROD_ITEM_PROCESS_MAST", desc: "Item Process", cols: 25 },
            { id: "PROD_ITEM_GROUP_MAST", name: "PROD_ITEM_GROUP_MAST", desc: "Item Group", cols: 18 },
            { id: "PRODTRAN_PROCESS", name: "PRODTRAN_PROCESS", desc: "Legacy Prod", cols: 58 },
          ]
        },
        logistics: {
          label: "🚚 Logistics",
          color: "#f97316",
          tables: [
            { id: "FREIGHT_ORDER_HEAD", name: "FREIGHT_ORDER_HEAD", desc: "Freight Order", cols: 45 },
          ]
        },
        mobile: {
          label: "📱 Mobile",
          color: "#ec4899",
          tables: [
            { id: "LHSSYS_USER_APP_KEY_VALIDATION", name: "LHSSYS_USER_APP_KEY_VALIDATION", desc: "Mobile App Keys", cols: 28 },
          ]
        }
      };

      const allTables = Object.entries(tableGroups).flatMap(([groupKey, group]) =>
        group.tables.map(t => ({ ...t, group: groupKey, groupColor: group.color }))
      );

      const visibleTables = selectedGroup === "all"
        ? allTables
        : allTables.filter(t => t.group === selectedGroup);

      const visibleIds = new Set(visibleTables.map(t => t.id));

      const allRelations = [
        { from: "ENTITY_MAST", to: "DIV_MAST", label: "1:N" },
        { from: "ENTITY_MAST", to: "ACC_YEAR_MAST", label: "1:N" },
        { from: "ENTITY_MAST", to: "CONFIG_MAST", label: "1:N" },
        { from: "USER_MAST", to: "ADDRESS_MAST", label: "creates" },
        { from: "USER_MAST", to: "LHSSYS_USER_APP_KEY_VALIDATION", label: "1:N" },
        { from: "ACC_MAST", to: "ADDRESS_MAST", label: "1:N" },
        { from: "ACC_MAST", to: "ORDER_HEAD", label: "places" },
        { from: "ACC_MAST", to: "ACC_TRAN", label: "posts" },
        { from: "CONFIG_MAST", to: "ORDER_HEAD", label: "configures" },
        { from: "INDENT_HEAD", to: "INDENT_BODY", label: "1:N" },
        { from: "INDENT_BODY", to: "ENQUIRY_BODY", label: "converts" },
        { from: "ENQUIRY_HEAD", to: "ENQUIRY_BODY", label: "1:N" },
        { from: "ENQUIRY_BODY", to: "ORDER_BODY", label: "→order" },
        { from: "ORDER_HEAD", to: "ORDER_BODY", label: "1:N" },
        { from: "ORDER_HEAD", to: "ORDER_AFIELD", label: "1:N" },
        { from: "ORDER_HEAD", to: "ITEMTRAN_HEAD", label: "executes" },
        { from: "ITEMTRAN_HEAD", to: "ITEMTRAN_BODY", label: "1:N" },
        { from: "ITEMTRAN_BODY", to: "GATETRAN_BODY", label: "gate" },
        { from: "GATETRAN_HEAD", to: "GATETRAN_BODY", label: "1:N" },
        { from: "GATETRAN_HEAD", to: "WB_HEAD", label: "weighs" },
        { from: "GATETRAN_HEAD", to: "QCTRAN_HEAD", label: "qc" },
        { from: "QCTRAN_HEAD", to: "QCTRAN_BODY", label: "1:N" },
        { from: "FREIGHT_ORDER_HEAD", to: "GATETRAN_HEAD", label: "1:N" },
        { from: "ORDER_BODY", to: "PROD_ORDER_HEAD", label: "makes" },
        { from: "PROD_ORDER_HEAD", to: "PROD_ORDER_BODY", label: "1:N" },
        { from: "PROD_ORDER_HEAD", to: "PROD_ORDER_ROUTING", label: "1:N" },
        { from: "PROD_ORDER_HEAD", to: "PROD_ORDER_PLAN", label: "1:N" },
        { from: "PROD_ORDER_BODY", to: "PROD_TRAN", label: "produces" },
        { from: "PROD_SETUP_HEAD", to: "PROD_SETUP_BODY", label: "1:N" },
        { from: "PROD_SETUP_HEAD", to: "PROD_SETUP_EQPT", label: "1:N" },
        { from: "PROD_SETUP_EQPT", to: "PROD_SETUP_ITEM", label: "1:N" },
        { from: "PROD_SETUP_HEAD", to: "PROD_SETUP_PLAN", label: "1:N" },
        { from: "PROD_ROUTING_MAST", to: "PROD_ROUTING_ALLOC_MAST", label: "1:N" },
        { from: "PROD_ITEM_GROUP_MAST", to: "PROD_ROUTING_MAST", label: "1:N" },
        { from: "PROD_ITEM_GROUP_MAST", to: "PROD_ITEM_PROCESS_MAST", label: "1:N" },
      ];

      const visibleRelations = allRelations.filter(r =>
        visibleIds.has(r.from) && visibleIds.has(r.to)
      );

      // Auto-fit layout calculation
      const getOptimalLayout = () => {
        const count = visibleTables.length;
        const containerWidth = window.innerWidth - 80;
        const containerHeight = window.innerHeight - 200;

        // Calculate optimal columns based on screen size and table count
        let cols;
        if (selectedGroup !== "all") {
          cols = Math.min(count, 4); // Max 4 per row for single group
        } else {
          cols = Math.ceil(Math.sqrt(count * 1.5)); // Golden ratio for all tables
        }

        const rows = Math.ceil(count / cols);

        // Calculate card size to fit screen
        const cardWidth = Math.min(180, Math.floor((containerWidth - (cols - 1) * 15) / cols));
        const cardHeight = Math.min(90, Math.floor((containerHeight - (rows - 1) * 20) / rows));

        return { cols, cardWidth, cardHeight, gapX: 15, gapY: 20 };
      };

      const layout = getOptimalLayout();

      const getTablePosition = (index) => ({
        x: 20 + (index % layout.cols) * (layout.cardWidth + layout.gapX),
        y: 20 + Math.floor(index / layout.cols) * (layout.cardHeight + layout.gapY)
      });

      const positions = {};
      visibleTables.forEach((t, i) => {
        positions[t.id] = { ...getTablePosition(i), ...t, ...layout };
      });

      const getConnectionPoint = (from, to) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const angle = Math.atan2(dy, dx);
        const w = layout.cardWidth, h = layout.cardHeight;
        return {
          x1: from.x + w / 2 + (w / 2 - 3) * Math.cos(angle),
          y1: from.y + h / 2 + (h / 2 - 3) * Math.sin(angle),
          x2: to.x + w / 2 - (w / 2 - 3) * Math.cos(angle),
          y2: to.y + h / 2 - (h / 2 - 3) * Math.sin(angle)
        };
      };

      const isHighlighted = (tableId) => {
        if (!hoveredTable) return false;
        if (hoveredTable === tableId) return true;
        return visibleRelations.some(r =>
          (r.from === hoveredTable && r.to === tableId) ||
          (r.to === hoveredTable && r.from === tableId)
        );
      };

      const svgWidth = Math.max(...Object.values(positions).map(p => p.x)) + layout.cardWidth + 40;
      const svgHeight = Math.max(...Object.values(positions).map(p => p.y)) + layout.cardHeight + 40;

      return (
        <div style={{
          background: "#020617",
          height: "100vh",
          display: "flex",
          flexDirection: "column",
          overflow: "hidden",
          fontFamily: "Inter, system-ui, sans-serif"
        }}>

          {/* Compact Header */}
          <div style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            padding: "12px 20px",
            borderBottom: "1px solid #1e293b",
            background: "#0f172a",
            flexShrink: 0
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <h1 style={{
                margin: 0,
                color: "#f8fafc",
                fontSize: "18px",
                fontWeight: "800"
              }}>
                🗄️ V7C ERP
              </h1>
              <span style={{ color: "#64748b", fontSize: "12px" }}>
                {visibleTables.length} tables
              </span>
            </div>

            {/* Filter Buttons - Compact */}
            <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
              <button
                onClick={() => setSelectedGroup("all")}
                style={{
                  padding: "6px 12px",
                  borderRadius: "6px",
                  border: "1px solid " + (selectedGroup === "all" ? "#6366f1" : "#334155"),
                  background: selectedGroup === "all" ? "#6366f1" : "transparent",
                  color: "#fff",
                  fontSize: "11px",
                  fontWeight: "600",
                  cursor: "pointer"
                }}
              >
                ALL
              </button>
              {Object.entries(tableGroups).map(([key, group]) => (
                <button
                  key={key}
                  onClick={() => setSelectedGroup(key)}
                  style={{
                    padding: "6px 12px",
                    borderRadius: "6px",
                    border: "1px solid " + (selectedGroup === key ? group.color : "#334155"),
                    background: selectedGroup === key ? group.color + "22" : "transparent",
                    color: selectedGroup === key ? group.color : "#94a3b8",
                    fontSize: "11px",
                    fontWeight: "600",
                    cursor: "pointer"
                  }}
                >
                  {group.label.split(" ")[0]}
                </button>
              ))}
            </div>
          </div>

          {/* Diagram - Fits Screen */}
          <div style={{
            flex: 1,
            background: "#0f172a",
            overflow: "hidden",
            display: "flex",
            alignItems: "center",
            justifyContent: "center"
          }}>
            <svg
              width="100%"
              height="100%"
              viewBox={`0 0 ${svgWidth} ${svgHeight}`}
              preserveAspectRatio="xMidYMid meet"
            >
              <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
                </marker>
              </defs>

              {/* Relations */}
              {visibleRelations.map((rel, i) => {
                const from = positions[rel.from];
                const to = positions[rel.to];
                if (!from || !to) return null;

                const { x1, y1, x2, y2 } = getConnectionPoint(from, to);
                const isActive = hoveredTable === rel.from || hoveredTable === rel.to;
                const isDimmed = hoveredTable && !isActive;

                return (
                  <g key={i} opacity={isDimmed ? 0.05 : isActive ? 1 : 0.2}>
                    <line
                      x1={x1} y1={y1}
                      x2={x2} y2={y2}
                      stroke={isActive ? from.groupColor : "#64748b"}
                      strokeWidth={isActive ? 2.5 : 1}
                      markerEnd="url(#arrow)"
                    />
                  </g>
                );
              })}

              {/* Tables */}
              {Object.entries(positions).map(([id, pos]) => {
                const highlighted = isHighlighted(id);
                const isSelected = selectedTable === id;
                const dimmed = hoveredTable && !highlighted;
                const w = pos.cardWidth;
                const h = pos.cardHeight;

                return (
                  <g
                    key={id}
                    onMouseEnter={() => setHoveredTable(id)}
                    onMouseLeave={() => setHoveredTable(null)}
                    onClick={() => setSelectedTable(isSelected ? null : id)}
                    style={{ cursor: "pointer" }}
                    opacity={dimmed ? 0.3 : 1}
                  >
                    {/* Card */}
                    <rect
                      x={pos.x} y={pos.y}
                      width={w} height={h}
                      rx={8}
                      fill={isSelected ? "#1e293b" : highlighted ? "#0f172a" : "#020617"}
                      stroke={isSelected ? pos.groupColor : highlighted ? pos.groupColor : "#334155"}
                      strokeWidth={isSelected ? 3 : highlighted ? 2 : 1}
                    />

                    {/* Color strip */}
                    <rect
                      x={pos.x} y={pos.y}
                      width={4} height={h}
                      rx={2}
                      fill={pos.groupColor}
                    />

                    {/* Table name - scaled */}
                    <text
                      x={pos.x + 10} y={pos.y + h * 0.35}
                      fill="#f8fafc"
                      fontSize={Math.max(9, h * 0.16)}
                      fontWeight="700"
                      fontFamily="monospace"
                    >
                      {pos.name.length > 20 ? pos.name.slice(0, 18) + ".." : pos.name}
                    </text>

                    {/* Description */}
                    <text
                      x={pos.x + 10} y={pos.y + h * 0.58}
                      fill="#94a3b8"
                      fontSize={Math.max(8, h * 0.13)}
                      fontFamily="sans-serif"
                    >
                      {pos.desc.length > 25 ? pos.desc.slice(0, 23) + ".." : pos.desc}
                    </text>

                    {/* Stats */}
                    <text
                      x={pos.x + 10} y={pos.y + h * 0.82}
                      fill={pos.groupColor}
                      fontSize={Math.max(7, h * 0.12)}
                      fontWeight="bold"
                      fontFamily="monospace"
                    >
                      {pos.cols} cols • {visibleRelations.filter(r => r.from === id || r.to === id).length} links
                    </text>

                    {/* Selection dot */}
                    {isSelected && (
                      <circle
                        cx={pos.x + w - 8}
                        cy={pos.y + 8}
                        r={4}
                        fill={pos.groupColor}
                      />
                    )}
                  </g>
                );
              })}
            </svg>
          </div>

          {/* Selected Table Panel - Slide from bottom */}
          {selectedTable && positions[selectedTable] && (
            <div style={{
              position: "fixed",
              bottom: "0",
              left: "0",
              right: "0",
              background: "#0f172a",
              borderTop: `3px solid ${positions[selectedTable].groupColor}`,
              padding: "16px 20px",
              boxShadow: "0 -10px 40px rgba(0,0,0,0.5)",
              zIndex: 100,
              maxHeight: "40vh",
              overflow: "auto"
            }}>
              <div style={{
                display: "flex",
                alignItems: "flex-start",
                gap: "16px",
                maxWidth: "1200px",
                margin: "0 auto"
              }}>
                <div style={{
                  width: 12,
                  height: 50,
                  borderRadius: 6,
                  background: positions[selectedTable].groupColor,
                  flexShrink: 0
                }}></div>

                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "8px" }}>
                    <h3 style={{
                      margin: 0,
                      color: "#f8fafc",
                      fontSize: "18px",
                      fontFamily: "monospace",
                      fontWeight: "800"
                    }}>
                      {positions[selectedTable].name}
                    </h3>
                    <span style={{
                      color: positions[selectedTable].groupColor,
                      fontSize: "12px",
                      background: positions[selectedTable].groupColor + "22",
                      padding: "2px 8px",
                      borderRadius: "4px"
                    }}>
                      {tableGroups[positions[selectedTable].group].label}
                    </span>
                    <button
                      onClick={() => setSelectedTable(null)}
                      style={{
                        marginLeft: "auto",
                        background: "#1e293b",
                        border: "none",
                        color: "#94a3b8",
                        width: 28,
                        height: 28,
                        borderRadius: 6,
                        fontSize: "16px",
                        cursor: "pointer"
                      }}
                    >
                      ×
                    </button>
                  </div>

                  <p style={{ margin: "0 0 12px 0", color: "#94a3b8", fontSize: "13px" }}>
                    {positions[selectedTable].desc}
                  </p>

                  {/* Connected tables horizontal list */}
                  <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", alignItems: "center" }}>
                    <span style={{ color: "#64748b", fontSize: "11px", fontWeight: "bold" }}>LINKED TO:</span>
                    {visibleRelations
                      .filter(r => r.from === selectedTable || r.to === selectedTable)
                      .slice(0, 6)
                      .map((r, i) => {
                        const otherId = r.from === selectedTable ? r.to : r.from;
                        const other = positions[otherId];
                        return other ? (
                          <span key={i} style={{
                            background: "#1e293b",
                            color: "#e2e8f0",
                            padding: "4px 10px",
                            borderRadius: "6px",
                            fontSize: "11px",
                            fontFamily: "monospace",
                            border: `1px solid ${other.groupColor}44`
                          }}>
                            {other.name}
                          </span>
                        ) : null;
                      })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Hint */}
          {!selectedTable && (
            <div style={{
              position: "fixed",
              bottom: "12px",
              left: "50%",
              transform: "translateX(-50%)",
              background: "#1e293b",
              padding: "8px 16px",
              borderRadius: "20px",
              color: "#64748b",
              fontSize: "12px",
              pointerEvents: "none"
            }}>

    // ─── BUILTINS TABLE ──────────────────────────────────────────────────────────

    const BuiltinsView = () => {
      const [search, setSearch] = useState("");
      const [catFilter, setCatFilter] = useState("All");
      const cats = ["All", ...Array.from(new Set(BUILTINS.map(b => b.category)))];
      const filtered = BUILTINS.filter(b =>
        (catFilter === "All" || b.category === catFilter) &&
        (b.name.toLowerCase().includes(search.toLowerCase()) || b.use.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div>
          <div className="flex flex-wrap gap-3 mb-5">
            <div className="relative flex-1 min-w-[200px]">
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search builtins..."
                className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-4 pr-10 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              />
              <svg className="w-4 h-4 text-slate-600 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div className="flex flex-wrap gap-2">
              {cats.map(c => (
                <button
                  key={c}
                  onClick={() => setCatFilter(c)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors ${catFilter === c ? 'text-white border-current' : 'text-slate-500 border-slate-700 hover:border-slate-500'}`}
                  style={{ backgroundColor: catFilter === c ? `${categoryColor(c)}33` : 'transparent', borderColor: catFilter === c ? categoryColor(c) : undefined, color: catFilter === c ? categoryColor(c) : undefined }}
                >
                  {c}
                </button>
              ))}
            </div>
          </div>

          <div className="border border-slate-800 rounded-xl overflow-hidden bg-slate-950">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                <tr>
                  {["#", "Built-In Name", "Category", "Syntax", "Use"].map(h => (
                    <th key={h} className="p-3 font-bold uppercase tracking-wider">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map((b) => (
                  <tr key={b.name} className="hover:bg-slate-900/50">
                    <td className="p-3 text-slate-500 font-mono">{b.no}</td>
                    <td className="p-3 font-bold text-violet-400 font-mono">{b.name}</td>
                    <td className="p-3"><Pill color={categoryColor(b.category)}>{b.category}</Pill></td>
                    <td className="p-3 font-mono text-sky-400 text-[11px] max-w-xs truncate">{b.syntax}</td>
                    <td className="p-3 text-slate-400 max-w-xs">{b.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-slate-600 text-xs mt-3">Showing {filtered.length} of {BUILTINS.length} builtins</p>
        </div>
      );
    };
