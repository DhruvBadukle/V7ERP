        // ─── TABLE CARD ───────────────────────────────────────────────────────────────

              <span className="ml-auto text-[10px] text-slate-500 font-medium">{table.columns.length} cols</span>

        // ─── TABLE DETAIL ──────────────────────────────────────────────────────────────

        // ─── ER DIAGRAM ───────────────────────────────────────────────────────────────

        const ERDiagram = () => {
          const [hovered, setHovered] = useState(null);
          
          // Responsive coordinates
          const positions = {
            ENTITY_MAST: { x: 340, y: 60 },
            USER_MAST: { x: 680, y: 60 },
            DIV_MAST: { x: 160, y: 220 },
            ACC_YEAR_MAST: { x: 500, y: 220 },
            CONFIG_MAST: { x: 160, y: 380 },
            ACC_MAST: { x: 720, y: 220 },
            ADDRESS_MAST: { x: 720, y: 380 },
            ORDER_HEAD: { x: 380, y: 380 },
            ORDER_BODY: { x: 380, y: 520 },
            LHSSYS_USER_APP_KEY_VALIDATION: { x: 560, y: 520 },
          };

          const tableColors = Object.fromEntries(DB_TABLES.map(t => [t.name, t.color]));

          return (
            <div className="overflow-x-auto pb-4">
              <svg width={920} height={640} className="mx-auto block">
                <defs>
                  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L8,3 z" fill="#475569" />
                  </marker>
                </defs>
                
                {/* Relations */}
                {ER_RELATIONS.map((rel, i) => {
                  const f = positions[rel.from], t = positions[rel.to];
                  if (!f || !t) return null;
                  const isHov = hovered === rel.from || hovered === rel.to;
                  const mx = (f.x + 80 + t.x + 80) / 2, my = (f.y + 22 + t.y + 22) / 2;
                  return (
                    <g key={i}>
                      <line 
                        x1={f.x + 80} y1={f.y + 22} x2={t.x + 80} y2={t.y + 22}
                        stroke={isHov ? "#6366f1" : "#1e293b"} 
                        strokeWidth={isHov ? 2 : 1.5}
                        markerEnd="url(#arrow)" 
                        strokeDasharray={isHov ? "0" : "4,3"} 
                      />
                      {isHov && (
                        <text x={mx} y={my - 4} textAnchor="middle" fontSize={10} fill="#94a3b8" className="font-mono">{rel.label}</text>
                      )}
                    </g>
                  );
                })}

                {/* Nodes */}
                {Object.entries(positions).map(([name, pos]) => {
                  const color = tableColors[name] || "#6366f1";
                  const table = DB_TABLES.find(t => t.name === name);
                  const isHov = hovered === name;
                  return (
                    <g 
                      key={name} 
                      onMouseEnter={() => setHovered(name)} 
                      onMouseLeave={() => setHovered(null)}
                      className="cursor-pointer"
                    >
                      <rect 
                        x={pos.x} y={pos.y} width={160} height={44} rx={8} ry={8} 
                        fill={isHov ? "#1e293b" : "#0f172a"} 
                        stroke={isHov ? color : "#1e293b"} 
                        strokeWidth={isHov ? 2 : 1.5} 
                      />
                      <rect x={pos.x} y={pos.y} width={5} height={44} rx={3} fill={color} />
                      <circle cx={pos.x + 15} cy={pos.y + 14} r={4} fill={color} />
                      <text 
                        x={pos.x + 26} y={pos.y + 18} 
                        fontSize={10} fontWeight="700" fill="#f1f5f9" className="font-mono"
                      >
                        {name.length > 18 ? name.slice(0, 16) + "…" : name}
                      </text>
                      <text x={pos.x + 26} y={pos.y + 32} fontSize={9} fill="#64748b" className="font-mono">
                        {table ? `${table.columns.length} cols` : ""}
                      </text>
                    </g>
                  );
                })}
              </svg>
              
              <div className="mt-6 flex flex-wrap gap-3 justify-center">
                {ER_RELATIONS.map((rel, i) => (
                  <div key={i} className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-[11px] text-slate-400 flex items-center gap-1.5">

                    <span className="text-slate-600">→</span>
                    <span className="text-emerald-400 font-bold font-mono">{rel.to}</span>
                    <span className="text-slate-500 ml-1">{rel.label}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        };

                  </tbody>
                </table>
              </div>
              <p className="text-slate-600 text-xs mt-3">Showing {filtered.length} of {BUILTINS.length} builtins</p>
            </div>
          );
        };

        // ─── FRAME / ITEM TYPES ───────────────────────────────────────────────────────

        const TypeGrid = ({ data, colorOffset = 0 }) => (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {data.map((item, i) => {
              const color = PALETTE[(i + colorOffset) % PALETTE.length];
              return (
                <div key={item.type} className="bg-slate-900 border border-slate-800 rounded-xl p-4 border-l-4 transition-transform hover:scale-[1.01]" style={{ borderLeftColor: color }}>
                  <div className="flex items-center gap-2 mb-3">
                    <span className="text-slate-600 font-mono text-xs">#{String(item.no).padStart(2, "0")}</span>
                    <span className="font-mono font-bold text-sm text-slate-100">{item.type}</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {item.subtypes.filter(Boolean).map(s => <Pill key={s} color={color}>{s}</Pill>)}
                  </div>
                </div>
              );
            })}
          </div>
        );

        // ─── MAIN APP ─────────────────────────────────────────────────────────────────

        const App = () => {
          const [activeTab, setActiveTab] = useState("overview");
          const [selectedTable, setSelectedTable] = useState(DB_TABLES[0]);

          const tabs = [
            { id: "overview", label: "Overview", icon: "🏠" },
            { id: "schema", label: "DB Schema", icon: "🗄️" },
            { id: "er", label: "ER Diagram", icon: "🔗" },
            { id: "frame", label: "Frame Types", icon: "🖼️" },
            { id: "items", label: "Item Types", icon: "🧩" },
            { id: "builtins", label: "Built-Ins", icon: "⚡" },
            { id: "filters", label: "Filter Flags", icon: "🔍" },
            { id: "patterns", label: "Input Patterns", icon: "📝" },
            { id: "library", label: "Library", icon: "📚" },
          ];

          return (
            <div className="min-h-screen bg-[#020617] text-slate-200 font-sans selection:bg-indigo-500/30">
              {/* Top Nav */}
              <nav className="sticky top-0 z-50 bg-[#050e1f]/90 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8">
                <div className="max-w-7xl mx-auto flex items-center">
                  <div className="flex items-center gap-3 py-4 mr-8 border-r border-slate-800 pr-8">
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                      ⚙
                    </div>
                    <div>
                      <div className="font-mono font-bold text-slate-100 text-sm tracking-tight">V7C ERP</div>
                      <div className="text-[10px] text-slate-500 font-medium">Documentation Portal</div>
                    </div>
                  </div>
                  
                  <div className="flex gap-1 overflow-x-auto no-scrollbar py-1">
                    {tabs.map(t => (
                      <button 
                        key={t.id} 
                        onClick={() => setActiveTab(t.id)}
                        className={`flex items-center gap-2 px-4 py-3 text-xs font-semibold whitespace-nowrap transition-colors border-b-2 ${activeTab === t.id ? 'tab-active' : 'tab-inactive'}`}
                      >
                        <span>{t.icon}</span>
                        <span>{t.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </nav>

              {/* Content */}
              <main className="max-w-7xl mx-auto p-4 sm:p-8">
                
                {/* OVERVIEW */}
                {activeTab === "overview" && (
                  <div className="animate-fade-in">
                    <div className="text-center mb-12 mt-4">
                      <div className="text-5xl mb-4 inline-block animate-bounce">⚙️</div>
                      <h1 className="text-4xl md:text-5xl font-black font-mono gradient-text mb-3">
                        V7C ERP Documentation
                      </h1>
                      <p className="text-slate-400 max-w-2xl mx-auto">
                        Complete reference for database schema, WMA framework components, and developer tooling.
                      </p>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12">
                      {[
                        { icon: "🗄️", label: "DB Tables", value: DB_TABLES.length, color: "#6366f1" },
                        { icon: "🔗", label: "Relations", value: ER_RELATIONS.length, color: "#8b5cf6" },
                        { icon: "🖼️", label: "Frame Types", value: FRAME_TYPES.length, color: "#10b981" },
                        { icon: "🧩", label: "Item Types", value: ITEM_TYPES.length, color: "#f59e0b" },
                        { icon: "⚡", label: "Built-Ins", value: BUILTINS.length, color: "#ec4899" },
                        { icon: "📚", label: "Libraries", value: LIBRARIES.length, color: "#14b8a6" },
                      ].map((s, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center border-t-4 hover:-translate-y-1 transition-transform duration-300" style={{ borderTopColor: s.color }}>
                          <div className="text-3xl mb-2">{s.icon}</div>
                          <div className="text-3xl font-black font-mono mb-1" style={{ color: s.color }}>{s.value}</div>
                          <div className="text-slate-500 text-xs font-bold uppercase tracking-wider">{s.label}</div>
                        </div>
                      ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <h3 className="text-slate-100 font-mono font-bold mb-4 flex items-center gap-2">
                          <span>📦</span> Database Tables
                        </h3>
                        <div className="space-y-1 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                          {DB_TABLES.map(t => (
                            <div 
                              key={t.name} 
                              onClick={() => { setSelectedTable(t); setActiveTab("schema"); }}
                              className="flex items-center gap-3 p-2.5 rounded-lg hover:bg-slate-800 cursor-pointer group transition-colors"
                            >
                              <div className="w-2 h-2 rounded-full flex-shrink-0 group-hover:scale-125 transition-transform" style={{ backgroundColor: t.color }}></div>
                              <span className="font-mono text-sm text-slate-300 group-hover:text-white flex-1">{t.name}</span>
                              <span className="text-[10px] text-slate-600 font-mono">{t.columns.length} cols</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <h3 className="text-slate-100 font-mono font-bold mb-4 flex items-center gap-2">
                          <span>🔗</span> Entity Relationships
                        </h3>
                        <div className="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                          {ER_RELATIONS.map((r, i) => (
                            <div key={i} className="flex items-center gap-2 text-xs p-2 rounded hover:bg-slate-800/50">
                              <span className="font-mono font-bold text-indigo-400">{r.from}</span>
                              <span className="text-slate-600">—{r.label}—▶</span>
                              <span className="font-mono font-bold text-emerald-400">{r.to}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* SCHEMA */}
                {activeTab === "schema" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="🗄️" title="Database Schema" subtitle="Oracle ERP table definitions with columns, types, keys and constraints" count={DB_TABLES.length} />
                    <div className="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-6">
                      <div className="flex flex-col gap-3 h-[calc(100vh-220px)] overflow-y-auto pr-2 custom-scrollbar">
                        {DB_TABLES.map(t => (
                          <TableCard key={t.name} table={t} selected={selectedTable?.name === t.name} onSelect={setSelectedTable} />
                        ))}
                      </div>
                      <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 lg:sticky lg:top-24 h-fit min-h-[500px]">
                        {selectedTable ? <TableDetail table={selectedTable} /> : (
                          <div className="h-full flex items-center justify-center text-slate-600">
                            Select a table to view details
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* ER DIAGRAM */}
                {activeTab === "er" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="🔗" title="ER Diagram" subtitle="Entity-Relationship visualization — hover nodes to highlight connections" />
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 overflow-hidden">
                      <ERDiagram />
                    </div>
                    <div className="mt-6 grid grid-cols-2 md:grid-cols-5 gap-3">
                      {DB_TABLES.map(t => (
                        <div key={t.name} className="bg-slate-900 border border-slate-800 rounded-lg p-3 border-l-4" style={{ borderLeftColor: t.color }}>
                          <div className="font-mono text-xs font-bold text-slate-200 truncate">{t.name}</div>
                          <div className="text-[10px] text-slate-500 truncate">{t.description}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* FRAME TYPES */}
                {activeTab === "frame" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="🖼️" title="Frame Types" subtitle="WMA framework canvas and layout types with their sub-types" count={FRAME_TYPES.length} />
                    <TypeGrid data={FRAME_TYPES} colorOffset={0} />
                  </div>
                )}

                {/* ITEM TYPES */}
                {activeTab === "items" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="🧩" title="Item Types" subtitle="UI component types available in the WMA framework" count={ITEM_TYPES.length} />
                    <TypeGrid data={ITEM_TYPES} colorOffset={3} />
                  </div>
                )}

                {/* BUILTINS */}
                {activeTab === "builtins" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="⚡" title="Built-In Functions" subtitle="Framework built-in commands for frames, items, pages, and records" count={BUILTINS.length} />
                    <BuiltinsView />
                  </div>
                )}

                {/* FILTER FLAGS */}
                {activeTab === "filters" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="🔍" title="Filter Flags" subtitle="Frame filter flag keywords separated by semicolons" count={FILTER_FLAGS.length} />
                    <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-6">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                          <tr>
                            {["Flag", "Use", "Can Use In"].map(h => <th key={h} className="p-4 font-bold uppercase text-xs tracking-wider">{h}</th>)}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {FILTER_FLAGS.map((f) => (
                            <tr key={f.flag} className="hover:bg-slate-900/50">
                              <td className="p-4"><Badge color="#6366f1">{f.flag}</Badge></td>
                              <td className="p-4 text-slate-300">{f.use}</td>
                              <td className="p-4 flex flex-wrap gap-2">
                                {f.canUseIn.split(",").map(u => <Pill key={u} color="#10b981">{u.trim()}</Pill>)}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 flex items-start gap-3">
                      <span className="text-amber-500 font-bold">⚠</span>
                      <div className="text-sm text-amber-200/80">
                        Frame Filter Flags must be separated by <code className="bg-slate-900 px-1.5 py-0.5 rounded text-amber-400 font-mono text-xs">;</code> (semicolon) only
                      </div>
                    </div>
                  </div>
                )}

                {/* INPUT PATTERNS */}
                {activeTab === "patterns" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="📝" title="Input Patterns" subtitle="Keywords used to configure text inputs, dropdowns, checkboxes and radio buttons" count={INPUT_PATTERNS.length} />
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {INPUT_PATTERNS.map((p, i) => (
                        <div key={p.keyword} className="bg-slate-900 border border-slate-800 rounded-xl p-5 border-l-4" style={{ borderLeftColor: PALETTE[i % PALETTE.length] }}>
                          <div className="flex items-center gap-3 mb-2">
                            <Badge color={PALETTE[i % PALETTE.length]}>{p.keyword}</Badge>
                            <span className="text-slate-600 text-xs">#{p.no}</span>
                          </div>
                          <p className="text-sm text-slate-400 leading-relaxed">{p.use}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* LIBRARY */}
                {activeTab === "library" && (
                  <div className="animate-fade-in">
                    <SectionHeader icon="📚" title="JavaScript Libraries" subtitle="AJS and OAJS helper library functions for client-side validation and operations" count={LIBRARIES.length} />
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {LIBRARIES.map((lib) => (
                        <div key={lib.name} className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors">
                          <div className="flex items-center gap-2 mb-2">
                            <span className="text-slate-600 font-mono text-xs">#{lib.no}</span>
                            <span className="font-mono font-bold text-sm text-violet-400">{lib.name}</span>
                          </div>
                          <p className="text-sm text-slate-400 mb-3 min-h-[40px]">{lib.use}</p>
                          {lib.syntax && (
                            <code className="block bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-sky-400 font-mono break-all">
                              {lib.syntax}
                            </code>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </main>

              <footer className="border-t border-slate-800 py-8 mt-12 text-center">
                <p className="text-slate-600 text-xs">
                  V7C ERP Documentation Portal — Oracle DB Schema + WMA Framework Reference
                </p>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.4s ease-out forwards;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
</body>
</html>
