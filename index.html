        { tcode: "ZP", tnature: "PROC", tnatureName: "Process Work", tname: "OTHER- RELATED TO PRODUCTION", series: "PP", seriesName: "Production Process", seriesType: "Daily", freezedate: "", status: "Active", description: "Production process entry" },
        { tcode: "ZM", tnature: "SLOG", tnatureName: "Shift Log", tname: "OTHER- RELATED TO PM", series: "S2", seriesName: "SHIFT LOG - RM", seriesType: "Daily", freezedate: "", status: "Active", description: "Shift log entry" },
        { tcode: "ZH", tnature: "APMT", tnatureName: "Appointment", tname: "OTHER- RELATED TO HRD", series: "AT", seriesName: "APPOINTMENT", seriesType: "Yearly", freezedate: "", status: "Active", description: "Employee appointment" },
        { tcode: "ZH", tnature: "EPAY", tnatureName: "Employee Salary", tname: "OTHER- RELATED TO HRD", series: "SP", seriesName: "EMPLOYEE PAYROLL", seriesType: "Monthly", freezedate: "", status: "Active", description: "Employee payroll" },
        { tcode: "ZZ", tnature: "SETUP", tnatureName: "Prod Setup", tname: "Tran Reversal", series: "PN", seriesName: "PRODUCTION SETUP", seriesType: "Yearly", freezedate: "", status: "Active", description: "Production setup" },
        { tcode: "ZZ", tnature: "REVS", tnatureName: "Transaction Reversal", tname: "Tran Reversal", series: "REV", seriesName: "Transaction Reversal", seriesType: "Yearly", freezedate: "", status: "Active", description: "Transaction reversal" },
        { tcode: "ZW", tnature: "WSLIP", tnatureName: "Weight Slip", tname: "WEIGHT-BRIDGE", series: "JO", seriesName: "OUTWARD - JOB WORK", seriesType: "Daily", freezedate: "", status: "Active", description: "Weighbridge weight slip" },
      ];

      // Group data by Tcode for overview
      const tcodeGroups = {};
      tcodeData.forEach(item => {
        if (!tcodeGroups[item.tcode]) {
          tcodeGroups[item.tcode] = [];
        }
        tcodeGroups[item.tcode].push(item);
      });

      // Tcode Detail Modal Component
      const TcodeDetailModal = ({ tcode, items, onClose }) => {
        const firstItem = items[0];

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={onClose}>
            <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden shadow-2xl" onClick={(e) => e.stopPropagation()}>
              {/* Header */}
              <div className="bg-gradient-to-r from-indigo-600/30 to-purple-600/30 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <div>
                  <div className="flex items-center gap-3">
                    <span className="text-3xl font-black font-mono text-indigo-400">{tcode}</span>
                    <span className="text-sm text-slate-400">Tcode</span>
                  </div>
                  <p className="text-xs text-slate-500 mt-1">{items.length} T-Nature configurations</p>
                </div>
                <button onClick={onClose} className="text-slate-500 hover:text-slate-300 transition-colors text-2xl">&times;</button>
              </div>

              {/* Content */}
              <div className="p-6 overflow-y-auto max-h-[calc(90vh-120px)]">
                {/* Summary Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                  <div className="bg-slate-800 rounded-xl p-3 text-center">
                    <div className="text-2xl font-bold text-indigo-400">{items.length}</div>
                    <div className="text-xs text-slate-500">Total T-Natures</div>
                  </div>
                  <div className="bg-slate-800 rounded-xl p-3 text-center">
                    <div className="text-2xl font-bold text-emerald-400">{items.filter(i => i.status === "Active").length}</div>
                    <div className="text-xs text-slate-500">Active</div>
                  </div>
                  <div className="bg-slate-800 rounded-xl p-3 text-center">
                    <div className="text-2xl font-bold text-amber-400">{items.filter(i => i.seriesType === "Daily").length}</div>
                    <div className="text-xs text-slate-500">Daily Series</div>
                  </div>
                  <div className="bg-slate-800 rounded-xl p-3 text-center">
                    <div className="text-2xl font-bold text-purple-400">{items.filter(i => i.freezedate).length}</div>
                    <div className="text-xs text-slate-500">Frozen</div>
                  </div>
                </div>

                {/* Table View */}
                <div className="border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-800">
                      <tr>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">T-Nature</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Name</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">TName</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Series</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Series Name</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Type</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Freeze Date</th>
                        <th className="p-3 font-bold text-xs text-slate-400 uppercase">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {items.map((item, idx) => (
                        <tr key={idx} className="hover:bg-slate-800/50 transition-colors">
                          <td className="p-3 font-mono font-bold text-cyan-400">{item.tnature}</td>
                          <td className="p-3 text-slate-300 text-xs">{item.tnatureName || "—"}</td>
                          <td className="p-3 text-slate-400 font-mono text-xs">{item.tname || "—"}</td>
                          <td className="p-3 font-mono text-amber-400 text-xs">{item.series}</td>
                          <td className="p-3 text-slate-400 text-xs max-w-[150px] truncate" title={item.seriesName}>{item.seriesName || "—"}</td>
                          <td className="p-3">
                            <span className={`text-[10px] px-2 py-0.5 rounded ${item.seriesType === 'Daily' ? 'bg-blue-500/20 text-blue-400' : item.seriesType === 'Monthly' ? 'bg-purple-500/20 text-purple-400' : 'bg-amber-500/20 text-amber-400'}`}>
                              {item.seriesType}
                            </span>
                          </td>
                          <td className="p-3 text-slate-500 text-xs">{item.freezedate || "—"}</td>
                          <td className="p-3">
                            <span className={`text-[10px] px-2 py-0.5 rounded ${item.status === 'Active' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                              {item.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* Description */}
                {firstItem.description && (
                  <div className="mt-4 p-4 bg-slate-800/50 rounded-xl">
                    <p className="text-xs text-slate-400">{firstItem.description}</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // Tcode Details Page Component
      const TcodeDetailsPage = () => {
        const [searchTerm, setSearchTerm] = useState("");
        const [filterStatus, setFilterStatus] = useState("All");
        const [filterSeriesType, setFilterSeriesType] = useState("All");

        const filteredData = tcodeData.filter(item => {
          const matchesSearch = item.tcode.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.tnature.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.tnatureName && item.tnatureName.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesStatus = filterStatus === "All" || item.status === filterStatus;
          const matchesSeriesType = filterSeriesType === "All" || item.seriesType === filterSeriesType;
          return matchesSearch && matchesStatus && matchesSeriesType;
        });

        const statuses = ["All", ...new Set(tcodeData.map(i => i.status))];
        const seriesTypes = ["All", ...new Set(tcodeData.map(i => i.seriesType))];

        return (
          <div className="animate-fade-in">
            <SectionHeader icon="📋" title="Tcode / T-Nature Configuration" subtitle="Complete list of all voucher types, series configurations, and transaction natures" count={tcodeData.length} />

            {/* Filters */}
            <div className="flex flex-wrap gap-3 mb-6">
              <div className="relative flex-1 min-w-[200px]">
                <input
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  placeholder="Search by Tcode, T-Nature, or Name..."
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-4 pr-10 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                />
                <svg className="w-4 h-4 text-slate-600 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </div>
              <select
                value={filterStatus}
                onChange={e => setFilterStatus(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              >
                {statuses.map(s => <option key={s} value={s}>Status: {s}</option>)}
              </select>
              <select
                value={filterSeriesType}
                onChange={e => setFilterSeriesType(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              >
                {seriesTypes.map(s => <option key={s} value={s}>Series: {s}</option>)}
              </select>
            </div>

            {/* Main Table */}
            <div className="border border-slate-800 rounded-xl overflow-hidden bg-slate-950">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Tcode</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">T-Nature</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">T-Nature Name</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Tname</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Series</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Series Name</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Series Type</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Freeze Date</th>
                      <th className="p-3 font-bold text-xs uppercase tracking-wider">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {filteredData.map((item, idx) => (
                      <tr key={idx} className="hover:bg-slate-900/50 transition-colors">
                        <td className="p-3 font-mono font-bold text-indigo-400">{item.tcode}</td>
                        <td className="p-3 font-mono font-bold text-cyan-400">{item.tnature}</td>
                        <td className="p-3 text-slate-300">{item.tnatureName || "—"}</td>
                        <td className="p-3 text-slate-400 font-mono text-xs">{item.tname || "—"}</td>
                        <td className="p-3 font-mono text-amber-400">{item.series}</td>
                        <td className="p-3 text-slate-400 max-w-[200px] truncate" title={item.seriesName}>{item.seriesName || "—"}</td>
                        <td className="p-3">
                          <span className={`text-[10px] px-2 py-0.5 rounded ${item.seriesType === 'Daily' ? 'bg-blue-500/20 text-blue-400' : item.seriesType === 'Monthly' ? 'bg-purple-500/20 text-purple-400' : 'bg-amber-500/20 text-amber-400'}`}>
                            {item.seriesType}
                          </span>
                        </td>
                        <td className="p-3 text-slate-500 text-xs">{item.freezedate || "—"}</td>
                        <td className="p-3">
                          <span className={`text-[10px] px-2 py-0.5 rounded ${item.status === 'Active' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                            {item.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {filteredData.length === 0 && (
                <div className="text-center py-12 text-slate-500">
                  No matching configurations found
                </div>
              )}
            </div>

            <p className="text-slate-600 text-xs mt-3">Showing {filteredData.length} of {tcodeData.length} configurations</p>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#020617] text-slate-200 font-sans selection:bg-indigo-500/30">
          {/* Tcode Detail Modal */}
          {showTcodeModal && selectedTcode && (
            <TcodeDetailModal
              tcode={selectedTcode}
              items={tcodeGroups[selectedTcode]}
              onClose={() => setShowTcodeModal(false)}
            />
          )}

          {/* Top Nav */}
          <nav className="sticky top-0 z-50 bg-[#050e1f]/90 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8">
            <div className="max-w-7xl mx-auto flex items-center">
              <div className="flex items-center gap-3 py-4 mr-8 border-r border-slate-800 pr-8">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                  ⚙
                </div>
                <div>
                  <div className="font-mono font-bold text-slate-100 text-sm tracking-tight">V7C ERP</div>
                  <div className="text-[10px] text-slate-500 font-medium">Documentation Portal</div>
                </div>
              </div>

              <div className="flex gap-1 overflow-x-auto no-scrollbar py-1">
                {tabs.map(t => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex items-center gap-2 px-4 py-3 text-xs font-semibold whitespace-nowrap transition-colors border-b-2 ${activeTab === t.id ? 'tab-active' : 'tab-inactive'}`}
                  >
                    <span>{t.icon}</span>
                    <span>{t.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Content */}
          <main className="max-w-7xl mx-auto p-4 sm:p-8">

            {/* OVERVIEW */}
            {activeTab === "overview" && (
              <div className="animate-fade-in">
                <div className="text-center mb-12 mt-4">
                  <div className="text-5xl mb-4 inline-block animate-bounce">⚙️</div>
                  <h1 className="text-4xl md:text-5xl font-black font-mono gradient-text mb-3">
                    V7C ERP Documentation
                  </h1>
                  <p className="text-slate-400 max-w-2xl mx-auto">
                    Complete reference for database schema, WMA framework components, and developer tooling.
                  </p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12">
                  {[
                    { icon: "🗄️", label: "DB Tables", value: DB_TABLES.length, color: "#6366f1", action: "schema" },
                    { icon: "🔗", label: "Common Fields", value: COMMON_FIELDS.length, color: "#10b981", action: "common" },
                    { icon: "🖼️", label: "Frame Types", value: FRAME_TYPES.length, color: "#f59e0b", action: "frame" },
                    { icon: "🧩", label: "Item Types", value: ITEM_TYPES.length, color: "#ec4899", action: "items" },
                    { icon: "⚡", label: "Built-Ins", value: BUILTINS.length, color: "#14b8a6", action: "builtins" },
                    { icon: "📚", label: "Libraries", value: LIBRARIES.length, color: "#8b5cf6", action: "library" },
                  ].map((s, idx) => (
                    <div
                      key={idx}
                      onClick={() => s.action && setActiveTab(s.action)}
                      className="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center border-t-4 hover:-translate-y-1 transition-transform duration-300 cursor-pointer"
                      style={{ borderTopColor: s.color }}
                    >
                      <div className="text-3xl mb-2">{s.icon}</div>
                      <div className="text-3xl font-black font-mono mb-1" style={{ color: s.color }}>{s.value}</div>
                      <div className="text-slate-500 text-xs font-bold uppercase tracking-wider">{s.label}</div>
                    </div>
                  ))}
                </div>

                {/* TCODE / TNATURE CONFIGURATION BLOCK - CARDS THAT CLICK TO SHOW DETAILS */}
                <div className="mb-12">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-1 h-8 rounded-full bg-gradient-to-b from-indigo-500 to-purple-600"></div>
                    <h2 className="text-lg font-bold text-slate-100 font-mono tracking-tight">
                      📋 Tcode / T-Nature Configuration
                    </h2>
                    <span className="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded-full">Click any card to view details</span>
                    <span className="ml-auto text-xs text-slate-500">{tcodeData.length} configurations</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                    {Object.entries(tcodeGroups).map(([tcode, items]) => (
                      <div
                        key={tcode}
                        onClick={() => {
                          setSelectedTcode(tcode);
                          setShowTcodeModal(true);
                        }}
                        className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-indigo-500/50 hover:scale-[1.02] transition-all duration-300 cursor-pointer group"
                      >
                        {/* Tcode Header */}
                        <div className="bg-gradient-to-r from-indigo-600/20 to-purple-600/20 px-4 py-3 border-b border-slate-800">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-bold text-xl text-indigo-400 group-hover:text-indigo-300 transition-colors">{tcode}</span>
                              <span className="text-xs text-slate-500">({items.length} T-Natures)</span>
                            </div>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full ${items[0].status === 'Active' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                              {items[0].status}
                            </span>
                          </div>
                        </div>

                        {/* T-Nature Items Preview */}
                        <div className="p-3 space-y-2 max-h-[280px] overflow-y-auto">
                          {items.slice(0, 5).map((item, idx) => (
                            <div key={idx} className="bg-slate-950 rounded-lg p-2.5 border border-slate-800 hover:border-slate-700 transition-all">
                              <div className="flex items-start justify-between mb-1.5">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <span className="font-mono text-sm font-bold text-cyan-400">{item.tnature}</span>
                                  {item.tnatureName && (
                                    <span className="text-[10px] text-slate-500 bg-slate-800 px-1.5 py-0.5 rounded truncate max-w-[100px]">
                                      {item.tnatureName}
                                    </span>
                                  )}
                                </div>
                              </div>

                              <div className="grid grid-cols-2 gap-1.5 text-[11px]">
                                <div className="flex items-center gap-1">
                                  <span className="text-slate-500">📁</span>
                                  <span className="text-slate-400 font-mono text-xs truncate">{item.tname || '—'}</span>
                                </div>
                                <div className="flex items-center gap-1">
                                  <span className="text-slate-500">🔢</span>
                                  <span className="text-slate-400 font-mono text-xs">{item.series}</span>
                                </div>
                                <div className="flex items-center gap-1">
                                  <span className="text-slate-500">⏱️</span>
                                  <span className={`text-[9px] px-1.5 py-0.5 rounded ${item.seriesType === 'Daily' ? 'bg-blue-500/20 text-blue-400' : item.seriesType === 'Monthly' ? 'bg-purple-500/20 text-purple-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                    {item.seriesType}
                                  </span>
                                </div>
                                <div className="flex items-center gap-1">
                                  <span className="text-slate-500">📅</span>
                                  <span className="text-slate-500 text-[9px]">{item.freezedate || '—'}</span>
                                </div>
                              </div>
                            </div>
                          ))}
                          {items.length > 5 && (
                            <div className="text-center text-[10px] text-indigo-400 py-1">
                              +{items.length - 5} more configurations
                            </div>
                          )}
                        </div>

                        {/* Footer stats */}
                        <div className="bg-slate-800/30 px-3 py-1.5 border-t border-slate-800 text-[10px] text-slate-500 flex justify-between">
                          <span>Series: {[...new Set(items.map(i => i.seriesType))].join(', ')}</span>
                          <span className="text-indigo-400">Click to view all →</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 className="text-slate-100 font-mono font-bold mb-4 flex items-center gap-2">
                      <span>📦</span> Database Tables
                    </h3>
                    <div className="space-y-1 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                      {DB_TABLES.map(t => (
                        <div
                          key={t.name}
                          onClick={() => { setSelectedTable(t); setActiveTab("schema"); }}
                          className="flex items-center gap-3 p-2.5 rounded-lg hover:bg-slate-800 cursor-pointer group transition-colors"
                        >
                          <div className="w-2 h-2 rounded-full flex-shrink-0 group-hover:scale-125 transition-transform" style={{ backgroundColor: t.color }}></div>
                          <span className="font-mono text-sm text-slate-300 group-hover:text-white flex-1">{t.name}</span>
                          <span className="text-[10px] text-slate-600 font-mono">{t.columns.length} cols</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 className="text-slate-100 font-mono font-bold mb-4 flex items-center gap-2">
                      <span>🔗</span> Top Common Fields
                    </h3>
                    <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                      {COMMON_FIELDS.slice(0, 15).map((f, i) => (
                        <div
                          key={f.name}
                          onClick={() => setActiveTab("common")}
                          className="flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 cursor-pointer group transition-colors border border-transparent hover:border-slate-700"
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-slate-600 font-mono text-xs w-6">#{i + 1}</span>
                            <span className="font-mono text-sm text-slate-300 group-hover:text-white">{f.name}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <Badge color={f.count >= 5 ? '#ef4444' : f.count >= 3 ? '#f59e0b' : '#6366f1'} small>
                              {f.count} tables
                            </Badge>
                          </div>
                        </div>
                      ))}
                      {COMMON_FIELDS.length > 15 && (
                        <div className="text-center py-2 text-xs text-slate-500">
                          +{COMMON_FIELDS.length - 15} more fields...
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* SCHEMA */}
            {activeTab === "schema" && (
              <div className="animate-fade-in">
                <SectionHeader icon="🗄️" title="Database Schema" subtitle="Oracle ERP table definitions with columns, types, keys and constraints" count={DB_TABLES.length} />
                <div className="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-6">
                  <div className="flex flex-col gap-3 h-[calc(100vh-220px)] overflow-y-auto pr-2 custom-scrollbar">
                    {DB_TABLES.map(t => (
                      <TableCard key={t.name} table={t} selected={selectedTable?.name === t.name} onSelect={setSelectedTable} />
                    ))}
                  </div>
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 lg:sticky lg:top-24 h-fit min-h-[500px]">
                    {selectedTable ? <TableDetail table={selectedTable} /> : (
                      <div className="h-full flex items-center justify-center text-slate-600">
                        Select a table to view details
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* COMMON FIELDS */}
            {activeTab === "common" && <CommonFieldsView />}

            {/* ER DIAGRAM */}
            {activeTab === "er" && (
              <div className="animate-fade-in">
                <SectionHeader icon="📊" title="ER Diagram" subtitle="Entity-Relationship visualization — hover nodes to highlight connections" />
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 overflow-hidden">
                  <ERDiagram />
                </div>
              </div>
            )}

            {/* FRAME TYPES */}
            {activeTab === "frame" && (
              <div className="animate-fade-in">
                <SectionHeader icon="🖼️" title="Frame Types" subtitle="WMA framework canvas and layout types with their sub-types" count={FRAME_TYPES.length} />
                <TypeGrid data={FRAME_TYPES} colorOffset={0} />
              </div>
            )}

            {/* ITEM TYPES */}
            {activeTab === "items" && (
              <div className="animate-fade-in">
                <SectionHeader icon="🧩" title="Item Types" subtitle="UI component types available in the WMA framework" count={ITEM_TYPES.length} />
                <TypeGrid data={ITEM_TYPES} colorOffset={3} />
              </div>
            )}

            {/* BUILTINS */}
            {activeTab === "builtins" && (
              <div className="animate-fade-in">
                <SectionHeader icon="⚡" title="Built-In Functions" subtitle="Framework built-in commands for frames, items, pages, and records" count={BUILTINS.length} />
                <BuiltinsView />
              </div>
            )}

            {/* FILTER FLAGS */}
            {activeTab === "filters" && (
              <div className="animate-fade-in">
                <SectionHeader icon="🔍" title="Filter Flags" subtitle="Frame filter flag keywords separated by semicolons" count={FILTER_FLAGS.length} />
                <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-6">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                      <tr>
                        {["Flag", "Use", "Can Use In"].map(h => <th key={h} className="p-4 font-bold uppercase text-xs tracking-wider">{h}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {FILTER_FLAGS.map((f) => (
                        <tr key={f.flag} className="hover:bg-slate-900/50">
                          <td className="p-4"><Badge color="#6366f1">{f.flag}</Badge></td>
                          <td className="p-4 text-slate-300">{f.use}</td>
                          <td className="p-4 flex flex-wrap gap-2">
                            {f.canUseIn.split(",").map(u => <Pill key={u} color="#10b981">{u.trim()}</Pill>)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 flex items-start gap-3">
                  <span className="text-amber-500 font-bold">⚠</span>
                  <div className="text-sm text-amber-200/80">
                    Frame Filter Flags must be separated by <code className="bg-slate-900 px-1.5 py-0.5 rounded text-amber-400 font-mono text-xs">;</code> (semicolon) only
                  </div>
                </div>
              </div>
            )}

            {/* INPUT PATTERNS */}
            {activeTab === "patterns" && (
              <div className="animate-fade-in">
                <SectionHeader icon="📝" title="Input Patterns" subtitle="Keywords used to configure text inputs, dropdowns, checkboxes and radio buttons" count={INPUT_PATTERNS.length} />
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {INPUT_PATTERNS.map((p, i) => (
                    <div key={p.keyword} className="bg-slate-900 border border-slate-800 rounded-xl p-5 border-l-4" style={{ borderLeftColor: PALETTE[i % PALETTE.length] }}>
                      <div className="flex items-center gap-3 mb-2">
                        <Badge color={PALETTE[i % PALETTE.length]}>{p.keyword}</Badge>
                        <span className="text-slate-600 text-xs">#{p.no}</span>
                      </div>
                      <p className="text-sm text-slate-400 leading-relaxed">{p.use}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* LIBRARY */}
            {activeTab === "library" && (
              <div className="animate-fade-in">
                <SectionHeader icon="📚" title="JavaScript Libraries" subtitle="AJS and OAJS helper library functions for client-side validation and operations" count={LIBRARIES.length} />
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {LIBRARIES.map((lib) => (
                    <div key={lib.name} className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors">
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-slate-600 font-mono text-xs">#{lib.no}</span>
                        <span className="font-mono font-bold text-sm text-violet-400">{lib.name}</span>
                      </div>
                      <p className="text-sm text-slate-400 mb-3 min-h-[40px]">{lib.use}</p>
                      {lib.syntax && (
                        <code className="block bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-sky-400 font-mono break-all">
                          {lib.syntax}
                        </code>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TCODE DETAILS PAGE */}
            {activeTab === "tcode" && <TcodeDetailsPage />}

          </main>

          <footer className="border-t border-slate-800 py-8 mt-12 text-center">
            <p className="text-slate-600 text-xs">
              V7C ERP Documentation Portal — Oracle DB Schema + WMA Framework Reference
            </p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.4s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</body>

</html>
